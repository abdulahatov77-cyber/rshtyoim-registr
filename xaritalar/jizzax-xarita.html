// Yandex plitkalari EPSG:3395 (elliptik Merkator) proyeksiyasida.
const res = []; for (let z = 0; z <= 19; z++) res.push(2 * 20037508.342789 / 256 / Math.pow(2, z));
const crs = new L.Proj.CRS('EPSG:3395',
  '+proj=merc +lon_0=0 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs',
  { resolutions: res, origin: [-20037508.342789, 20037508.342789] });

const map = L.map('map', { crs, zoomControl: true });
L.tileLayer('https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&scale=1&lang=ru_RU', {
  maxZoom: 18, attribution: '&copy; <a href="https://yandex.ru/maps">Yandex</a> · chegaralar: OSM'
}).addTo(map);

L.geoJSON(OTHERS, { style: { color: '#9aa3b2', weight: 1, fillColor: '#ffffff', fillOpacity: .55 },
  interactive: false }).addTo(map);
const region = L.geoJSON(REGION, { style: { color: '#1d2433', weight: 2.5, fillOpacity: 0 },
  interactive: false }).addTo(map);
L.geoJSON(TUMAN, {
  style: { color: '#5c6b85', weight: 1, dashArray: '4 3', fillColor: '#fff', fillOpacity: 0 },
  onEachFeature: (f, l) => {
    l.bindTooltip(f.properties.n, { permanent: true, direction: 'center', className: 'lbl tuman' });
    l.on('mouseover', () => l.setStyle({ color: '#fff', weight: 3, fillColor: '#1c7ed6', fillOpacity: .12 }));
    l.on('mouseout', () => l.setStyle({ color: '#5c6b85', weight: 1, fillOpacity: 0 }));
  }
}).addTo(map);
LABELS.forEach(x => L.tooltip({ permanent: true, direction: 'center', className: 'lbl ' + x.c, interactive: false })
  .setLatLng(x.p).setContent(x.t).addTo(map));
region.bringToFront();
map.fitBounds(region.getBounds(), { padding: [12, 12] });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const color = m => m.angiograf && m.mskt ? 'var(--both)' : m.angiograf ? 'var(--ang)' : 'var(--mskt)';
const hex = { 'var(--both)': '#7048e8', 'var(--ang)': '#d6336c', 'var(--mskt)': '#1c7ed6' };
const tags = m => (m.angiograf ? '<span class="tag a">ANGIOGRAF</span>' : '') +
  (m.mskt ? '<span class="tag m">MSKT</span>' : '') +
  (m.trombektomiya ? '<span class="tag x">trombektomiya</span>' : '');
const popup = m => `<b>${esc(m.name)}</b>${m.muqobil_nom ? '<br><i>' + esc(m.muqobil_nom) + '</i>' : ''}
  <br>${esc(m.tuman)}${m.address ? '<br>' + esc(m.address) : ''}<br><div style="margin-top:6px">${tags(m)}</div>`;

const markers = DATA.map(m => {
  const mk = L.circleMarker([m.lat, m.lng], { radius: m.angiograf ? 9 : 7, color: '#fff', weight: 2,
    fillColor: hex[color(m)], fillOpacity: .95 }).bindPopup(popup(m)).bindTooltip(m.name);
  return { m, mk };
});

function render() {
  const a = document.getElementById('f-ang').checked, s = document.getElementById('f-mskt').checked;
  const list = document.getElementById('list');
  list.innerHTML = '';
  const shown = markers.filter(({ m }) => (a && m.angiograf) || (s && m.mskt));
  markers.forEach(({ mk }) => map.removeLayer(mk));
  shown.sort((x, y) => (y.m.angiograf - x.m.angiograf) || x.m.name.localeCompare(y.m.name));
  shown.forEach(({ m, mk }) => {
    mk.addTo(map);
    const li = document.createElement('li');
    li.innerHTML = `<div class="n"><span class="dot" style="background:${color(m)}"></span> ${esc(m.name)}</div>
      <div class="t">${esc(m.tuman)}</div><div style="margin-top:4px">${tags(m)}</div>`;
    li.onclick = () => { map.setView([m.lat, m.lng], 14); mk.openPopup(); };
    list.appendChild(li);
  });
  if (!shown.length) list.innerHTML = '<li class="empty">Tanlangan turdagi muassasa yo‘q</li>';
}
document.getElementById('f-ang').onchange = render;
document.getElementById('f-mskt').onchange = render;
render();
const zl = () => document.getElementById('map').classList.toggle('small', map.getZoom() < 8);
map.on('zoomend', zl); zl();
</script>
