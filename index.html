<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSHTYOIM — Infarkt va Insult Registr</title>
  <meta name="description" content="Respublika Shoshilinch Tibbiy Yordam Ilmiy Markazi — Infarkt va Insult bemorlari registri" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind is generated at build time; no runtime compiler is shipped. -->
  <link rel="stylesheet" href="css/tailwind.generated.css?v=1" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body class="font-sans min-h-screen" style="background:#F8FAFC;color:#334155">

  <!-- App Root -->
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh">
      <div style="text-align:center">
        <div style="width:48px;height:48px;border:3px solid #2563EB;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
        <p style="color:#64748B;font-size:14px">Yuklanmoqda...</p>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:360px"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- Deferred bootstrap keeps execution order; route modules load on demand. -->
  <script defer src="js/loader.js?v=1"></script>
  <script defer src="js/bootstrap.js?v=1"></script>

  <!-- Versiya tekshiruvi: 30 daqiqada bir marta, barcha tablar uchun umumiy -->
  <script>
    (function() {
      const APP_BUILD = '20260814-177';
      const BUILD_KEY = 'rshtyoim_build';
      const LAST_CHECK_KEY = 'rshtyoim_last_check';
      const CHECK_INTERVAL = 30 * 60 * 1000; // 30 daqiqa

      const stored = localStorage.getItem(BUILD_KEY);
      if (stored && stored !== APP_BUILD) {
        localStorage.setItem(BUILD_KEY, APP_BUILD);
        location.reload();
        return;
      }
      localStorage.setItem(BUILD_KEY, APP_BUILD);

      let _reloadBannerShown = false;

      async function checkVersion() {
        if (_reloadBannerShown) return;

        // Throttle: oxirgi tekshiruvdan 30 daqiqa o'tmagan bo'lsa — so'rov yubormaymiz.
        // localStorage barcha tablar uchun umumiy, shuning uchun ko'p tab ochiq bo'lsa ham
        // 30 daqiqada faqat bitta so'rov ketadi.
        const now = Date.now();
        const last = parseInt(localStorage.getItem(LAST_CHECK_KEY) || '0', 10);
        if (now - last < CHECK_INTERVAL) return;
        localStorage.setItem(LAST_CHECK_KEY, String(now));

        try {
          const r = await fetch('/index.html?_=' + now, { cache: 'no-store' });
          const txt = await r.text();
          const m = txt.match(/APP_BUILD\s*=\s*'([^']+)'/);
          if (m && m[1] !== APP_BUILD) {
            _reloadBannerShown = true;
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1d4ed8;color:white;text-align:center;padding:16px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 24px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;gap:16px';
            div.innerHTML = '<span>🔄 Tizim yangilandi! Ishingizni saqlab, sahifani yangilang.</span><button onclick="location.reload()" style="background:white;color:#1d4ed8;border:none;border-radius:8px;padding:8px 20px;font-weight:800;cursor:pointer;font-size:14px;flex-shrink:0">Hozir yangilash ↺</button>';
            document.body.prepend(div);
            // Majburiy avtomatik reload YO'Q — shifokor forma to'ldirayotgan bo'lsa
            // ma'lumot yo'qolmasligi uchun. Faqat tugma orqali yangilanadi.
          }
        } catch(e) {}
      }

      setInterval(checkVersion, CHECK_INTERVAL);

      // Tabga qaytganda ham tekshiramiz, lekin yuqoridagi throttle tufayli
      // 30 daqiqada bir martadan ko'p so'rov ketmaydi.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkVersion();
      });

      // Versiya ko'rsatkichi — pastki o'ng burchakda (telefon orqali diagnostika uchun)
      function showBuild() {
        const b = document.createElement('div');
        b.id = 'app-build-label';
        b.textContent = 'v' + APP_BUILD;
        b.style.cssText = 'position:fixed;bottom:2px;right:6px;z-index:9999;font-size:10px;color:#94a3b8;pointer-events:none;font-family:monospace';
        document.body.appendChild(b);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showBuild);
      else showBuild();
    })();
  </script>
</body>
</html>
